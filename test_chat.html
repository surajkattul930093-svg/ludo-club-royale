<!DOCTYPE html>
<html>
<head>
<style>
@keyframes chat-pop {
  0% { opacity: 0; transform: scale(0.5) translateY(10px); }
  50% { transform: scale(1.1) translateY(-2px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes chat-fade {
  0%, 80% { opacity: 1; }
  100% { opacity: 0; pointer-events: none; }
}
.animate-chat-bubble {
  animation: chat-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, chat-fade 3s linear forwards;
}
@keyframes emoji-laugh {
  0% { transform: scale(1) translateY(0); }
  25% { transform: scale(1.3) translateY(-5px) rotate(10deg); }
  50% { transform: scale(1.3) translateY(5px) rotate(-10deg); }
  75% { transform: scale(1.3) translateY(-5px) rotate(10deg); }
  100% { transform: scale(1.3) translateY(0) rotate(0deg); }
}
.emoji-laugh { animation: emoji-laugh 0.5s ease-in-out infinite; }
</style>
</head>
<body>
  <div style="position: relative; margin: 100px;">
    Seat
    <div class="animate-chat-bubble" style="position: absolute; top: -30px; left: 10px;">
      <div style="background: white; border: 2px solid #ccc; padding: 10px; border-radius: 10px;">
        <span class="emoji-laugh" style="font-size: 30px; display: inline-block;">😂</span>
      </div>
    </div>
  </div>
</body>
</html>
